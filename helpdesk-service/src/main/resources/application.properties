server.port=8080
spring.application.name=helpdesk-service
# member 3: database settings (same MySQL server as Guided Lab 08)
# run database/helpdesk.sql first - it creates helpdesk_db, the tables and the admin account
# demonstration login only - change the url, username and password to match your own MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/helpdesk_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=usbw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate checks the entity mappings against the tables without deleting data
spring.jpa.hibernate.ddl-auto=validate
# show readable SQL while testing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
